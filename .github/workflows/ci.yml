name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ui-backend/go.mod
          cache-dependency-path: ui-backend/go.sum
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Not gofmt-formatted:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ui-backend/go.mod
          cache-dependency-path: ui-backend/go.sum
      # Same version and config as harvester/vm-import-controller.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: ui-backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's build stage.
          node-version: 18
          cache: yarn
          cache-dependency-path: ui-frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: CI=true yarn test --watchAll=false
      - run: CI=true yarn build

  chart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charts/harvester-migration
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Add the upstream chart repository
        run: helm repo add harvester https://charts.harvesterhci.io
      - run: helm dependency build
      # Token mode (the default) copies the Rancher CA with lookup(), which is empty
      # without a cluster, so offline renders pass an explicit CA secret.
      - run: helm lint . --set ui.auth.ca.existingSecret=ca
      - name: Version-mismatch warning and support matrix
        run: ../../hack/check-version-warning.sh
      - name: Render every mode
        run: |
          set -euo pipefail
          CA="--set ui.auth.ca.existingSecret=ca"
          helm template t . $CA > /dev/null
          helm template t . $CA --set controller.enabled=false > /dev/null
          helm template t . $CA --set ui.networkPolicy.enabled=true > /dev/null
          helm template t . $CA --set export.enabled=true --set export.storage.create=true > /dev/null
          helm template t . --set ui.auth.insecureSkipTLSVerify=true > /dev/null
          helm template t . --set ui.auth.mode=serviceaccount > /dev/null
          helm template t . $CA --set 'ui.access.users={user-abc}' --set 'ui.access.groups={local://g-1}' | grep -q 'kind: RoleBinding'
      - name: Default (token) mode without a CA must fail loudly
        run: |
          if helm template t . 2> err.txt; then
            echo "expected failure"; exit 1
          fi
          grep -q "tls-rancher" err.txt
      - name: Token mode leaves the UI ServiceAccount without cluster rights
        run: |
          out="$(helm template t . --set ui.auth.ca.existingSecret=ca)"
          # no ClusterRole for the UI (only the controller's own role remains)
          [ "$(echo "$out" | grep -c '^kind: ClusterRole$')" -eq 1 ]
          echo "$out" | grep -q 'automountServiceAccountToken: false'
      - name: Controller names Harvester depends on are preserved
        run: |
          out="$(helm template t . --set ui.auth.ca.existingSecret=ca)"
          echo "$out" | grep -q 'app.kubernetes.io/name: harvester-vm-import-controller'
          echo "$out" | grep -qE '^  name: harvester-vm-import-controller$'

  image:
    # Build only, to catch Dockerfile breakage on PRs. Publishing is in release.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=ui-image
          cache-to: type=gha,scope=ui-image,mode=max
