apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harvester-migration.ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harvester-migration.ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  {{- if .Values.export.enabled }}
  # The pod mounts the export volume. A rolling update runs the new pod beside the old one,
  # possibly on another node, and a volume that can be attached to one node at a time
  # (Harvester's default "migratable" Longhorn class) then fails to mount and the rollout
  # hangs. Replacing the pod costs a minute of downtime and cannot get stuck that way.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "harvester-migration.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "harvester-migration.ui.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "harvester-migration.ui.serviceAccountName" . }}
      {{- if and (eq .Values.ui.auth.mode "token") (not .Values.export.enabled) }}
      automountServiceAccountToken: false
      {{- else }}
      automountServiceAccountToken: true
      {{- end }}
      {{- with .Values.ui.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: {{ include "harvester-migration.ui.image" . | quote }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          env:
            - name: USER_AUTH
              value: {{ .Values.ui.auth.mode | quote }}
            {{- if eq .Values.ui.auth.mode "token" }}
            - name: KUBE_API_URL
              value: {{ .Values.ui.auth.apiUrl | quote }}
            {{- if .Values.ui.auth.insecureSkipTLSVerify }}
            - name: INSECURE_SKIP_TLS_VERIFY
              value: "true"
            {{- else }}
            - name: KUBE_API_CA_FILE
              value: /etc/migration-ui/ca/{{ .Values.ui.auth.ca.key }}
            {{- end }}
            {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.ui.env.logLevel | quote }}
            - name: UI_PATH
              value: {{ .Values.ui.env.uiPath | quote }}
            - name: USE_MOCK_DATA
              value: {{ .Values.ui.env.useMockData | quote }}
            - name: FORKLIFT_NAMESPACE
              value: {{ .Values.engines.forklift.namespace | quote }}
            {{- if .Values.export.enabled }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: EXPORT_ROOT
              value: {{ .Values.export.storage.mountPath | quote }}
            - name: EXPORT_PVC
              value: {{ include "harvester-migration.exportClaimName" . | quote }}
            - name: EXPORT_STORAGE_CLASS
              value: {{ .Values.export.storage.storageClass | quote }}
            - name: EXPORT_STORAGE_SIZE
              value: {{ .Values.export.storage.size | quote }}
            - name: EXPORT_IMAGE
              value: "{{ .Values.export.image.repository | default .Values.ui.image.repository }}:{{ .Values.export.image.tag | default .Values.ui.image.tag | default .Chart.AppVersion }}"
            - name: EXPORT_MAX_CONCURRENT
              value: {{ .Values.export.maxConcurrent | quote }}
            - name: EXPORT_TTL_SECONDS
              value: {{ .Values.export.ttlSecondsAfterFinished | quote }}
            - name: EXPORT_TICKET_KEY
              # Signs the download tickets; shared by every replica and kept
              # across restarts and upgrades.
              valueFrom:
                secretKeyRef:
                  name: {{ include "harvester-migration.exportTicketSecretName" . }}
                  key: key
            - name: EXPORT_RUN_AS_USER
              value: {{ .Values.export.securityContext.runAsUser | quote }}
            - name: EXPORT_FS_GROUP
              value: {{ .Values.export.securityContext.fsGroup | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and (eq .Values.ui.auth.mode "token") (not .Values.ui.auth.insecureSkipTLSVerify) }}
            - name: api-ca
              mountPath: /etc/migration-ui/ca
              readOnly: true
            {{- end }}
            {{- if .Values.export.enabled }}
            - name: export-storage
              mountPath: {{ .Values.export.storage.mountPath }}
            {{- end }}
          {{- with .Values.ui.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and (eq .Values.ui.auth.mode "token") (not .Values.ui.auth.insecureSkipTLSVerify) }}
        - name: api-ca
          secret:
            secretName: {{ include "harvester-migration.ui.caSecretName" . }}
        {{- end }}
        {{- if .Values.export.enabled }}
        - name: export-storage
          persistentVolumeClaim:
            claimName: {{ include "harvester-migration.exportClaimName" . }}
        {{- end }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
