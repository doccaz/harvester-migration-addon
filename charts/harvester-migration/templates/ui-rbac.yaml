{{- if .Values.ui.rbac.create }}
{{- /* TODO(phase 2): replace with per-user authorisation and narrower rules. */ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "harvester-migration.ui.fullname" . }}
  labels:
    {{- include "harvester-migration.ui.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Provider/source credentials
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["harvesterhci.io"]
    resources: ["settings", "virtualmachineimages"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["network.harvesterhci.io"]
    resources: ["vlanconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.engines.vmic.enabled }}
  - apiGroups: ["migration.harvesterhci.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  {{- if .Values.engines.forklift.enabled }}
  - apiGroups: ["forklift.konveyor.io"]
    resources: ["providers", "plans", "migrations", "networkmaps", "storagemaps", "hosts", "forkliftcontrollers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  {{- if .Values.export.enabled }}
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "harvester-migration.ui.fullname" . }}
  labels:
    {{- include "harvester-migration.ui.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "harvester-migration.ui.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "harvester-migration.ui.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
