{{- if .Values.ui.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "harvester-migration.ui.fullname" . }}
  labels:
    {{- include "harvester-migration.ui.labels" . | nindent 4 }}
rules:
  # Derived from the API calls in ui-backend (see docs/rbac-audit.md).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  # Source/provider credentials. No list/watch: secrets are only fetched by name.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list"]
  - apiGroups: ["harvesterhci.io"]
    resources: ["settings"]
    verbs: ["get"]
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["list"]
  {{- if .Values.engines.vmic.enabled }}
  - apiGroups: ["migration.harvesterhci.io"]
    resources: ["vmwaresources", "ovasources", "virtualmachineimports"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["migration.harvesterhci.io"]
    resources: ["virtualmachineimports/status"]
    verbs: ["update"]
  {{- end }}
  {{- if .Values.engines.forklift.enabled }}
  - apiGroups: ["forklift.konveyor.io"]
    resources: ["providers", "plans", "networkmaps", "storagemaps", "migrations"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["forklift.konveyor.io"]
    resources: ["forkliftcontrollers"]
    verbs: ["get", "list"]
  {{- end }}
  {{- if .Values.export.enabled }}
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "harvester-migration.ui.fullname" . }}
  labels:
    {{- include "harvester-migration.ui.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "harvester-migration.ui.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "harvester-migration.ui.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
