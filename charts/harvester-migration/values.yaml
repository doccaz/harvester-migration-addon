# Default values for harvester-migration.

# ── VM Import Controller (upstream subchart) ───────────────────────────────
controller:
  enabled: true
  # Escape hatch for the conflict guard. Leave false: two controllers
  # reconciling the same VirtualMachineImport CRs will fight each other.
  skipConflictCheck: false

harvester-vm-import-controller:
  # Harvester finds the controller by these names/labels (storage-network
  # setting validator, util.HarvesterVMImportController). Do not change.
  fullnameOverride: harvester-vm-import-controller
  nameOverride: ""

# ── Migration engines (UI modules + RBAC only) ─────────────────────────────
# The UI detects what is installed at runtime. These flags only decide which
# permissions the UI ServiceAccount is granted. Forklift itself is a separate
# add-on (harvester/forklift-packaging) and is never installed from here.
engines:
  vmic:
    enabled: true
  forklift:
    enabled: true
    namespace: forklift

# ── UI ─────────────────────────────────────────────────────────────────────
ui:
  replicaCount: 1
  image:
    # Built from this repo's Dockerfile. Not published yet: build and push it
    # (see docs/phase2-verification.md) or override repository/tag. Do NOT point
    # this at doccaz/vm-import-ui: images before this repo ignore USER_AUTH and
    # would silently run on the shared ServiceAccount.
    repository: ghcr.io/doccaz/harvester-migration-ui
    pullPolicy: IfNotPresent
    # Defaults to the chart appVersion.
    tag: ""
  imagePullSecrets: []
  env:
    logLevel: info
    uiPath: /ui
    useMockData: "false"
  service:
    # ClusterIP by default. Reach the UI through the Harvester menu entry
    # (NavLink) or `kubectl port-forward`. Set NodePort only on trusted networks.
    type: ClusterIP
    port: 8080
    nodePort: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  rbac:
    create: true
  # How the UI authorises Kubernetes calls.
  #   token (default): every call uses the signed-in user's own Rancher token, so
  #     Kubernetes RBAC applies per user. The ServiceAccount gets no cluster
  #     rights and no mounted token. Verified on Harvester 1.8.2 (docs/identity.md).
  #   serviceaccount: every user acts with the UI's ServiceAccount (see
  #     docs/rbac-audit.md). Only for trusted, admin-only environments, or where
  #     Rancher is not available.
  auth:
    mode: token
    # Where user tokens are presented. Rancher tokens are valid at Rancher only.
    apiUrl: https://rancher.cattle-system.svc/k8s/clusters/local
    # CA that signed the endpoint's certificate. By default the chart copies the
    # public certificate (only tls.crt, never the key) of the Rancher listener CA
    # from cattle-system/tls-rancher at install/upgrade time. Re-run an upgrade if
    # that CA is ever regenerated. Set existingSecret to supply your own bundle
    # (needed for `helm template` without a cluster, or a different apiUrl).
    ca:
      existingSecret: ""
      key: ca.crt
    insecureSkipTLSVerify: false
  # Who may open the UI through the Kubernetes service proxy (the menu entry).
  # Cluster admins always can. Everyone else needs `get/create/update/delete` on
  # services/proxy for the UI Service; this creates that Role and binds it to the
  # listed Rancher users/groups. This only controls who can *reach* the UI: what a
  # user can then do is decided by their own permissions on the resources.
  access:
    createRole: true
    users: []   # e.g. ["user-abc12"]
    groups: []  # e.g. ["local://g-xyz78"] or a Harvester/Rancher group principal
  # Restricts ingress to the UI port. With no `from` entries any source may
  # connect to 8080; set `from` (podSelector/namespaceSelector/ipBlock) to narrow.
  # Off by default: it needs a CNI that enforces policies and a known source.
  networkPolicy:
    enabled: false
    from: []
  navLink:
    enabled: true
    label: "VM Migration"
    group: "Utilities"
    description: "Import VMs into Harvester"
    url: ""
    iconSrc: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── VM Export (Harvester VM -> OVA), off by default ────────────────────────
# Runs as a Job in the source VM's namespace; needs a ReadWriteMany volume.
export:
  enabled: false
  storage:
    existingClaim: ""
    create: false
    storageClass: ""
    size: 200Gi
    accessMode: ReadWriteMany
    mountPath: /export
  maxConcurrent: 2
  ttlSecondsAfterFinished: 0
  activeDeadlineSeconds: 21600
  defaultProfile: vmware
  image:
    repository: ""
    tag: ""
  securityContext:
    runAsUser: 0
    fsGroup: 0
